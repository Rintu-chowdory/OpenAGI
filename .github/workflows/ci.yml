name: CI

on:
  [push, pull_request]

jobs:
  run-pytest:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install package and test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install -r requirements-dev.txt

    - name: CLI smoke test
      run: |
        openagi --version
        openagi list | grep -q "rintu/dev_ops_agent"
        openagi tools | grep -q "wikipedia/wikipedia"

    - name: Run tests
      run: |
        pytest -v tests
